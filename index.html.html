    <!-- Application Core Architecture & JS Logic -->
    <script>
        /**
         * GUARDIÕES DO BRAVO - ARQUITETURA SENIOR
         * Camada Repository + Data Processing + Component System
         */

        // ==========================================
        // 1. DATA COMPRESSION UTILITIES
        // ==========================================
        const DataUtils = {
            /**
             * Comprime imagem carregada pelo utilizador antes da persistência Base64
             */
            compressImage: (file, maxWidth = 800, quality = 0.7) => {
                return new Promise((resolve, reject) => {
                    const reader = new FileReader();
                    reader.readAsDataURL(file);
                    reader.onload = (event) => {
                        const img = new Image();
                        img.src = event.target.result;
                        img.onload = () => {
                            const canvas = document.createElement('canvas');
                            let width = img.width;
                            let height = img.height;

                            if (width > maxWidth) {
                                height = Math.round((height * maxWidth) / width);
                                width = maxWidth;
                            }

                            canvas.width = width;
                            canvas.height = height;
                            const ctx = canvas.getContext('2d');
                            ctx.drawImage(img, 0, 0, width, height);
                            const compressedBase64 = canvas.toDataURL('image/jpeg', quality);
                            resolve(compressedBase64);
                        };
                        img.onerror = (err) => reject(err);
                    };
                    reader.onerror = (err) => reject(err);
                });
            },
            formatCurrency: (amount) => {
                return new Intl.NumberFormat('pt-PT', { style: 'currency', currency: 'EUR' }).format(amount || 0);
            },
            formatDate: (dateStr) => {
                if (!dateStr) return '-';
                const parts = dateStr.split('-');
                if (parts.length === 3) return `${parts[2]}/${parts[1]}/${parts[0]}`;
                return dateStr;
            },
            generateId: () => 'id_' + Math.random().toString(36).substr(2, 9)
        };

        // ==========================================
        // 2. DB REPOSITORY (DATA ACCESSS LAYER)
        // ==========================================
        const DBRepository = {
            STORAGE_PREFIX: 'gdb_app_',
            
            // Definição de coleções e schemas de dados iniciais
            getInitialSeed: () => ({
                moradores: [
                    { id: 'm1', nome: 'Carlos Silva', fracao: 'Apt 101 - Bloco A', telefone: '+351 912 345 678', email: 'carlos@exemplo.pt', tipo: 'Proprietário', dataEntrada: '2022-01-15' },
                    { id: 'm2', nome: 'Ana Martins', fracao: 'Apt 202 - Bloco A', telefone: '+351 923 456 789', email: 'ana.m@exemplo.pt', tipo: 'Inquilino', dataEntrada: '2023-05-10' },
                    { id: 'm3', nome: 'Roberto Ramos', fracao: 'Apt 304 - Bloco B', telefone: '+351 934 567 890', email: 'roberto@exemplo.pt', tipo: 'Proprietário', dataEntrada: '2021-09-01' }
                ],
                estoque: [
                    { id: 'e1', codigo: 'EST-001', nome: 'Lâmpadas LED 12W', categoria: 'Eletricidade', quantidade: 8, quantMinima: 15, localizacao: 'Armazém Central', custoUnidade: 4.50 },
                    { id: 'e2', codigo: 'EST-002', nome: 'Detergente Industrial 5L', categoria: 'Limpeza', quantidade: 24, quantMinima: 10, localizacao: 'Armazém Limpeza', custoUnidade: 12.00 },
                    { id: 'e3', codigo: 'EST-003', nome: 'Chaves de Acesso / Tags', categoria: 'Segurança', quantidade: 4, quantMinima: 10, localizacao: 'Receção', custoUnidade: 2.50 }
                ],
                inventarios: [
                    { id: 'inv1', titulo: 'Balanço Geral de Fim de Ano', dataAgendada: '2026-11-15', responsavel: 'Carlos Silva', estado: 'Agendado', observacoes: 'Contagem completa de todos os ativos de eletricidade e limpeza.' }
                ],
                financeiro: [
                    { id: 'f1', tipo: 'RECEBER', descricao: 'Quota Condominial - Apt 101', valorTotal: 120.00, valorPago: 120.00, dataVencimento: '2026-10-05', dataPagamento: '2026-10-04', estado: 'PAGO', contaId: 'c1', categoriaId: 'cat1' },
                    { id: 'f2', tipo: 'PAGAR', descricao: 'Manutenção de Elevadores - Mensal', valorTotal: 350.00, valorPago: 150.00, dataVencimento: '2026-10-25', dataPagamento: null, estado: 'PARCIAL', contaId: 'c1', categoriaId: 'cat2' },
                    { id: 'f3', tipo: 'PAGAR', descricao: 'Fatura de Eletricidade Áreas Comuns', valorTotal: 210.50, valorPago: 0, dataVencimento: '2026-11-02', dataPagamento: null, estado: 'PENDENTE', contaId: 'c1', categoriaId: 'cat3' }
                ],
                contasBancarias: [
                    { id: 'c1', banco: 'Banco Comercial (CGD)', iban: 'PT50 0035 0000 1234 5678 9012 3', saldoInicial: 4500.00, tipo: 'Ordem' },
                    { id: 'c2', banco: 'Fundo de Reserva (Millennium BCP)', iban: 'PT50 0033 0000 9876 5432 1098 7', saldoInicial: 12800.00, tipo: 'Poupança/Reserva' }
                ],
                categorias: [
                    { id: 'cat1', nome: 'Quotas de Condomínio', tipo: 'RECEITA' },
                    { id: 'cat2', nome: 'Manutenção e Elevadores', tipo: 'DESPESA' },
                    { id: 'cat3', nome: 'Serviços Públicos (Água/Luz)', tipo: 'DESPESA' },
                    { id: 'cat4', nome: 'Limpeza e Higienização', tipo: 'DESPESA' }
                ],
                formasPagamento: [
                    { id: 'fp1', nome: 'Transferência Bancária / MBWay' },
                    { id: 'fp2', nome: 'Débito Direto (SEPA)' },
                    { id: 'fp3', nome: 'Numerário / Espécie' }
                ],
                documentos: [
                    { id: 'd1', titulo: 'Regulamento Interno 2026.pdf', categoria: 'Regulamentos', dataUpload: '2026-01-10', ficheiroUrl: '', tamanho: '1.2 MB' },
                    { id: 'd2', titulo: 'Ata da Assembleia Geral Ordinária.pdf', categoria: 'Atas', dataUpload: '2026-03-22', ficheiroUrl: '', tamanho: '850 KB' }
                ],
                utilizadores: [
                    { id: 'u1', nome: 'Administrador Sênior', email: 'admin@guardioesbravo.pt', perfil: 'Administrador', ultimoAcesso: '2026-10-23' },
                    { id: 'u2', nome: 'Portaria & Segurança', email: 'portaria@guardioesbravo.pt', perfil: 'Operador', ultimoAcesso: '2026-10-22' }
                ]
            }),

            // Garante inicialização e integridade
            init: function() {
                const seed = this.getInitialSeed();
                Object.keys(seed).forEach(collection => {
                    if (!localStorage.getItem(this.STORAGE_PREFIX + collection)) {
                        this.saveCollection(collection, seed[collection]);
                    }
                });
            },

            getCollection: function(collectionName) {
                try {
                    const data = localStorage.getItem(this.STORAGE_PREFIX + collectionName);
                    return data ? JSON.parse(data) : [];
                } catch (e) {
                    console.error('Erro ao ler coleção do Storage:', collectionName, e);
                    return [];
                }
            },

            saveCollection: function(collectionName, items) {
                try {
                    localStorage.setItem(this.STORAGE_PREFIX + collectionName, JSON.stringify(items));
                    return true;
                } catch (e) {
                    console.error('Erro ao guardar no Storage:', collectionName, e);
                    app.showToast('Erro de armazenamento! O limite de armazenamento local pode ter sido atingido.', 'error');
                    return false;
                }
            },

            insert: function(collectionName, item) {
                const items = this.getCollection(collectionName);
                if (!item.id) item.id = DataUtils.generateId();
                items.push(item);
                this.saveCollection(collectionName, items);
                return item;
            },

            update: function(collectionName, id, updatedFields) {
                const items = this.getCollection(collectionName);
                const index = items.findIndex(i => i.id === id);
                if (index !== -1) {
                    items[index] = { ...items[index], ...updatedFields };
                    this.saveCollection(collectionName, items);
                    return items[index];
                }
                return null;
            },

            delete: function(collectionName, id) {
                let items = this.getCollection(collectionName);
                items = items.filter(i => i.id !== id);
                this.saveCollection(collectionName, items);
            },

            reset: function() {
                localStorage.clear();
                this.init();
            }
        };

        // ==========================================
        // 3. APPLICATION LOGIC & CONTROLLER
        // ==========================================
        const app = {
            currentTab: 'dashboard',

            init: function() {
                DBRepository.init();
                this.renderTabs();
                this.checkStockAlerts();
                this.navigate(this.currentTab);
            },

            tabs: [
                { id: 'dashboard', label: 'Painel Geral', icon: 'fa-chart-pie' },
                { id: 'estoque', label: 'Stock & Inventário', icon: 'fa-boxes-stacked' },
                { id: 'financeiro', label: 'Pagar & Receber', icon: 'fa-wallet' },
                { id: 'moradores', label: 'Moradores & Frações', icon: 'fa-users' },
                { id: 'documentos', label: 'Documentos', icon: 'fa-folder-closed' },
                { id: 'bancos', label: 'Contas & Meios', icon: 'fa-building-columns' },
                { id: 'relatorios', label: 'Relatórios / DRE', icon: 'fa-file-invoice-dollar' },
                { id: 'utilizadores', label: 'Utilizadores', icon: 'fa-user-shield' }
            ],

            renderTabs: function() {
                const navContainer = document.getElementById('main-nav-tabs');
                navContainer.innerHTML = this.tabs.map(tab => `
                    <button onclick="app.navigate('${tab.id}')" class="flex items-center space-x-2 px-4 py-2.5 rounded-xl text-sm font-medium transition-all whitespace-nowrap ${this.currentTab === tab.id ? 'bg-emerald-600/10 text-emerald-400 border border-emerald-500/30' : 'text-slate-400 hover:text-slate-200 hover:bg-slate-800/60'}">
                        <i class="fa-solid ${tab.icon}"></i>
                        <span>${tab.label}</span>
                    </button>
                `).join('');
            },

            navigate: function(tabId) {
                this.currentTab = tabId;
                this.renderTabs();
                const container = document.getElementById('app-view');

                switch (tabId) {
                    case 'dashboard':
                        this.renderDashboard(container);
                        break;
                    case 'estoque':
                        this.renderEstoque(container);
                        break;
                    case 'financeiro':
                        this.renderFinanceiro(container);
                        break;
                    case 'moradores':
                        this.renderMoradores(container);
                        break;
                    case 'documentos':
                        this.renderDocumentos(container);
                        break;
                    case 'bancos':
                        this.renderBancos(container);
                        break;
                    case 'relatorios':
                        this.renderRelatorios(container);
                        break;
                    case 'utilizadores':
                        this.renderUtilizadores(container);
                        break;
                    default:
                        container.innerHTML = `<div class="p-8 text-center text-slate-400">Módulo em desenvolvimento...</div>`;
                }
            },

            checkStockAlerts: function() {
                const estoque = DBRepository.getCollection('estoque');
                const lowStockItems = estoque.filter(i => Number(i.quantidade) <= Number(i.quantMinima));
                const alertPill = document.getElementById('stock-alert-pill');
                const alertCount = document.getElementById('stock-alert-count');

                if (lowStockItems.length > 0) {
                    alertPill.classList.remove('hidden');
                    alertPill.classList.add('flex');
                    alertCount.textContent = `${lowStockItems.length} item(ns) com stock baixo`;
                } else {
                    alertPill.classList.add('hidden');
                    alertPill.classList.remove('flex');
                }
            },

            showToast: function(msg, type = 'info') {
                const toast = document.createElement('div');
                const bg = type === 'error' ? 'bg-rose-900/90 border-rose-500 text-rose-100' : 'bg-emerald-900/90 border-emerald-500 text-emerald-100';
                const icon = type === 'error' ? 'fa-circle-xmark' : 'fa-circle-check';
                
                toast.className = `flex items-center space-x-3 px-4 py-3 rounded-xl border shadow-xl backdrop-blur transition-all duration-300 transform translate-y-2 pointer-events-auto ${bg}`;
                toast.innerHTML = `<i class="fa-solid ${icon}"></i><span class="text-sm font-medium">${msg}</span>`;

                const container = document.getElementById('toast-container');
                container.appendChild(toast);
                setTimeout(() => {
                    toast.classList.add('opacity-0', 'translate-y-4');
                    setTimeout(() => toast.remove(), 300);
                }, 3500);
            },

            closeModal: function() {
                document.getElementById('global-modal').classList.add('hidden');
            },

            openModal: function(title, bodyHtml) {
                const container = document.getElementById('modal-content-container');
                container.innerHTML = `
                    <div class="flex items-center justify-between px-6 py-4 border-b border-slate-800">
                        <h3 class="text-lg font-semibold text-white">${title}</h3>
                        <button onclick="app.closeModal()" class="text-slate-400 hover:text-white transition-colors">
                            <i class="fa-solid fa-xmark text-xl"></i>
                        </button>
                    </div>
                    <div class="p-6">
                        ${bodyHtml}
                    </div>
                `;
                document.getElementById('global-modal').classList.remove('hidden');
            },

            resetDataConfirm: function() {
                if (confirm('Atenção: Tem a certeza de que deseja repor todos os dados para os valores por omissão?')) {
                    DBRepository.reset();
                    this.checkStockAlerts();
                    this.navigate(this.currentTab);
                    this.showToast('Dados de teste restaurados com sucesso.');
                }
            },

            // ==========================================
            // MODULE RENDERERS
            // ==========================================

                const totalReceber = financeiro.filter(f => f.tipo === 'RECEBER').reduce((acc, cur) => acc + (cur.valorTotal - cur.valorPago), 0);
                const totalPagar = financeiro.filter(f => f.tipo === 'PAGAR').reduce((acc, cur) => acc + (cur.valorTotal - cur.valorPago), 0);

                container.innerHTML = `
                    <div class="space-y-6">
                        <!-- Top Summary Cards -->
                        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4">
                            <div class="bg-slate-900 border border-slate-800 rounded-2xl p-5 relative overflow-hidden">
                                <div class="flex items-center justify-between">
                                    <span class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Total Moradores</span>
                                    <div class="w-10 h-10 rounded-xl bg-blue-500/10 text-blue-400 flex items-center justify-center">
                                        <i class="fa-solid fa-users text-lg"></i>
                                    </div>
                                </div>
                                <div class="mt-4">
                                    <span class="text-3xl font-bold text-white">${moradores.length}</span>
                                    <span class="text-xs text-slate-400 ml-2">Frações registadas</span>
                                </div>
                            </div>

                            <div class="bg-slate-900 border border-slate-800 rounded-2xl p-5 relative overflow-hidden">
                                <div class="flex items-center justify-between">
                                    <span class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Valores a Receber</span>
                                    <div class="w-10 h-10 rounded-xl bg-emerald-500/10 text-emerald-400 flex items-center justify-center">
                                        <i class="fa-solid fa-hand-holding-dollar text-lg"></i>
                                    </div>
                                </div>
                                <div class="mt-4">
                                    <span class="text-2xl font-bold text-emerald-400">${DataUtils.formatCurrency(totalReceber)}</span>
                                    <span class="text-xs text-slate-400 block mt-0.5">Pendentes / Parciais</span>
                                </div>
                            </div>

                            <div class="bg-slate-900 border border-slate-800 rounded-2xl p-5 relative overflow-hidden">

                                    <span class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Alertas de Stock</span>
                                    <div class="w-10 h-10 rounded-xl ${lowStock.length > 0 ? 'bg-amber-500/20 text-amber-400' : 'bg-slate-800 text-slate-400'} flex items-center justify-center">
                                        <i class="fa-solid fa-boxes-stacked text-lg"></i>
                                    </div>
                                </div>
                                <div class="mt-4">
                                    <span class="text-3xl font-bold ${lowStock.length > 0 ? 'text-amber-400' : 'text-white'}">${lowStock.length}</span>
                                    <span class="text-xs text-slate-400 ml-2">Itens em nível crítico</span>
                                </div>
                            </div>
                        </div>

                        <!-- Central Grid Section -->
                        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
                            <!-- Stock Warning Card -->
                            <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 lg:col-span-1 flex flex-col justify-between">
                                <div>
                                    <div class="flex items-center justify-between mb-4">
                                        <h3 class="text-base font-semibold text-white flex items-center gap-2">
                                            <i class="fa-solid fa-triangle-exclamation text-amber-400"></i> Stock Baixo / Alerta

                                                    </div>
                                                    <button onclick="app.quickAddStockModal('${item.id}')" class="px-2.5 py-1 bg-amber-500/10 text-amber-400 hover:bg-amber-500/20 rounded-lg text-xs font-semibold">

                    quantidade: Number(document.getElementById('est-quantidade').value),
                    quantMinima: Number(document.getElementById('est-quantMinima').value)
                };

                if (id) {
                    DBRepository.update('estoque', id, payload);
                    this.showToast('Item atualizado com sucesso.');
                } else {
                    DBRepository.insert('estoque', payload);
                    this.showToast('Novo item registado no stock.');

                this.closeModal();
                this.checkStockAlerts();
                this.navigate('estoque');

                    this.navigate('estoque');

                DBRepository.insert('financeiro', payload);
                this.closeModal();
                this.showToast('Lançamento financeiro adicionado.');
                this.navigate('financeiro');
            },

            openBaixaModal: function(id) {
                const item = DBRepository.getCollection('financeiro').find(f => f.id === id);
                if (!item) return;
                const pendente = item.valorTotal - item.valorPago;

                const html = `
                    <form onsubmit="app.saveBaixa(event, '${id}')" class="space-y-4">
                        <div class="p-3 bg-slate-950 rounded-xl border border-slate-800">
                            <p class="text-xs text-slate-400">Lançamento: <span class="text-white font-medium">${item.descricao}</span></p>
                            <p class="text-xs text-slate-400 mt-1">Valor Total: <span class="text-white">${DataUtils.formatCurrency(item.valorTotal)}</span> | Já Liquidado: <span class="text-emerald-400">${DataUtils.formatCurrency(item.valorPago)}</span></p>
                            <p class="text-xs text-amber-400 font-semibold mt-1">Valor Em Falta: ${DataUtils.formatCurrency(pendente)}</p>
                        </div>

                        <div>
                            <label class="block text-xs font-medium text-slate-400 mb-1">Valor da Baixa Afectado Agora (€)</label>
                            <input type="number" step="0.01" id="baixa-valor" max="${pendente}" value="${pendente}" required class="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-sm text-white focus:border-emerald-500 outline-none">
                        </div>

                        <div class="flex justify-end space-x-3 pt-4">
                            <button type="button" onclick="app.closeModal()" class="px-4 py-2 bg-slate-800 text-slate-300 rounded-xl text-xs font-semibold">Cancelar</button>
                            <button type="submit" class="px-4 py-2 bg-emerald-600 text-white rounded-xl text-xs font-semibold">Confirmar Baixa</button>
                        </div>
                    </form>
                `;
                this.openModal('Registar Baixa de Pagamento', html);
            },

            saveBaixa: function(e, id) {
                e.preventDefault();
                const item = DBRepository.getCollection('financeiro').find(f => f.id === id);
                const valorBaixa = Number(document.getElementById('baixa-valor').value);

                const novoValorPago = item.valorPago + valorBaixa;
                let novoEstado = 'PARCIAL';
                if (novoValorPago >= item.valorTotal) {
                    novoEstado = 'PAGO';
                }

                DBRepository.update('financeiro', id, {
                    valorPago: novoValorPago,
                    estado: novoEstado,
                    dataPagamento: new Date().toISOString().split('T')[0]
                });

                this.closeModal();
                this.showToast('Baixa de pagamento registada.');
                this.navigate('financeiro');
            },

            deleteFinanceiro: function(id) {
                if (confirm('Eliminar registo financeiro?')) {
                    DBRepository.delete('financeiro', id);
                    this.showToast('Lançamento eliminado.');
                    this.navigate('financeiro');
                }
            },

            // --- 4. MORADORES MODULE ---
            renderMoradores: function(container) {
                const moradores = DBRepository.getCollection('moradores');
                container.innerHTML = `
                    <div class="space-y-6">
                        <div class="flex flex-col md:flex-row md:items-center justify-between gap-4">
                            <div>
                                <h2 class="text-xl font-bold text-white">Moradores & Frações</h2>
                                <p class="text-xs text-slate-400">Registo de condóminos, inquilinos e frações.</p>
                            </div>
                            <button onclick="app.openMoradorModal()" class="px-4 py-2 bg-emerald-600 hover:bg-emerald-500 text-white rounded-xl text-xs font-semibold shadow-lg shadow-emerald-600/20 flex items-center space-x-2">
                                <i class="fa-solid fa-user-plus"></i>
                                <span>Novo Morador</span>
                            </button>
                        </div>

                        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                            ${moradores.map(m => `
                                <div class="bg-slate-900 border border-slate-800 rounded-2xl p-5 space-y-3 relative hover:border-slate-700 transition-colors">
                                    <div class="flex justify-between items-start">
                                        <div>
                                            <h3 class="font-bold text-white text-base">${m.nome}</h3>
                                            <span class="text-xs text-emerald-400 font-medium">${m.fracao}</span>
                                        </div>
                                        <span class="px-2 py-0.5 text-xs rounded bg-slate-800 text-slate-300 border border-slate-700">${m.tipo}</span>
                                    </div>
                                    <div class="space-y-1 text-xs text-slate-400 pt-2 border-t border-slate-800/80">
                                        <p><i class="fa-solid fa-phone w-4 text-slate-500"></i> ${m.telefone}</p>
                                        <p><i class="fa-solid fa-envelope w-4 text-slate-500"></i> ${m.email}</p>
                                    </div>
                                    <div class="flex justify-end space-x-2 pt-2">
                                        <button onclick="app.openMoradorModal('${m.id}')" class="text-xs text-slate-400 hover:text-white p-1">Editar</button>
                                        <button onclick="app.deleteMorador('${m.id}')" class="text-xs text-rose-400 hover:text-rose-300 p-1">Eliminar</button>
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                `;
            },

            openMoradorModal: function(id = null) {
                const item = id ? DBRepository.getCollection('moradores').find(m => m.id === id) : {};
                const html = `
                    <form onsubmit="app.saveMorador(event, '${id || ''}')" class="space-y-4">
                        <div>
                            <label class="block text-xs font-medium text-slate-400 mb-1">Nome Completo</label>
                            <input type="text" id="mor-nome" value="${item.nome || ''}" required class="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-sm text-white focus:border-emerald-500 outline-none">
                        </div>
                        <div class="grid grid-cols-2 gap-4">
                            <div>
                                <label class="block text-xs font-medium text-slate-400 mb-1">Fração / Apartamento</label>
                                <input type="text" id="mor-fracao" value="${item.fracao || ''}" required class="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-sm text-white focus:border-emerald-500 outline-none">
                            </div>
                            <div>
                                <label class="block text-xs font-medium text-slate-400 mb-1">Tipo</label>
                                <select id="mor-tipo" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-sm text-white focus:border-emerald-500 outline-none">
                                    <option value="Proprietário" ${item.tipo === 'Proprietário' ? 'selected' : ''}>Proprietário</option>
                                    <option value="Inquilino" ${item.tipo === 'Inquilino' ? 'selected' : ''}>Inquilino</option>
                                </select>
                            </div>
                        </div>
                        <div class="grid grid-cols-2 gap-4">
                            <div>
                                <label class="block text-xs font-medium text-slate-400 mb-1">Telefone</label>
                                <input type="text" id="mor-telefone" value="${item.telefone || ''}" required class="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-sm text-white focus:border-emerald-500 outline-none">
                            </div>
                            <div>
                                <label class="block text-xs font-medium text-slate-400 mb-1">E-mail</label>
                                <input type="email" id="mor-email" value="${item.email || ''}" required class="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-sm text-white focus:border-emerald-500 outline-none">
                            </div>
                        </div>
                        <div class="flex justify-end space-x-3 pt-4">
                            <button type="button" onclick="app.closeModal()" class="px-4 py-2 bg-slate-800 text-slate-300 rounded-xl text-xs font-semibold">Cancelar</button>
                            <button type="submit" class="px-4 py-2 bg-emerald-600 text-white rounded-xl text-xs font-semibold">Guardar Morador</button>
                        </div>
                    </form>
                `;
                this.openModal(id ? 'Editar Morador' : 'Novo Morador', html);
            },

            saveMorador: function(e, id) {
                e.preventDefault();
                const payload = {
                    nome: document.getElementById('mor-nome').value,
                    fracao: document.getElementById('mor-fracao').value,
                    tipo: document.getElementById('mor-tipo').value,
                    telefone: document.getElementById('mor-telefone').value,
                    email: document.getElementById('mor-email').value,
                };
                if (id) {
                    DBRepository.update('moradores', id, payload);
                    this.showToast('Dados do morador atualizados.');
                } else {
                    DBRepository.insert('moradores', payload);
                    this.showToast('Novo morador registado.');
                }
                this.closeModal();
                this.navigate('moradores');
            },

            deleteMorador: function(id) {
                if (confirm('Eliminar este morador?')) {
                    DBRepository.delete('moradores', id);
                    this.showToast('Morador eliminado.');
                    this.navigate('moradores');
                }
            },

            // --- 5. DOCUMENTOS COM COMPRESSÃO AUTOMÁTICA ---
            renderDocumentos: function(container) {
                const docs = DBRepository.getCollection('documentos');
                container.innerHTML = `
                    <div class="space-y-6">
                        <div class="flex flex-col md:flex-row md:items-center justify-between gap-4">
                            <div>
                                <h2 class="text-xl font-bold text-white">Documentos & Atas Condominiais</h2>
                                <p class="text-xs text-slate-400">Armazenamento otimizado com compressão de ficheiros anexados.</p>
                            </div>
                            <button onclick="app.openDocumentoModal()" class="px-4 py-2 bg-emerald-600 hover:bg-emerald-500 text-white rounded-xl text-xs font-semibold shadow-lg shadow-emerald-600/20 flex items-center space-x-2">
                                <i class="fa-solid fa-cloud-arrow-up"></i>
                                <span>Carregar Documento</span>
                            </button>
                        </div>

                        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                            ${docs.map(d => `
                                <div class="bg-slate-900 border border-slate-800 rounded-2xl p-5 space-y-3">
                                    <div class="flex items-center space-x-3">
                                        <div class="w-10 h-10 rounded-xl bg-blue-500/10 text-blue-400 flex items-center justify-center">
                                            <i class="fa-solid fa-file-pdf text-xl"></i>
                                        </div>
                                        <div>
                                            <h4 class="font-semibold text-white text-sm line-clamp-1">${d.titulo}</h4>
                                            <span class="text-xs text-slate-400">${d.categoria}</span>
                                        </div>
                                    </div>
                                    <div class="text-xs text-slate-400 pt-2 border-t border-slate-800 flex justify-between">
                                        <span>Data: ${DataUtils.formatDate(d.dataUpload)}</span>
                                        <span>${d.tamanho || 'Otimizado'}</span>
                                    </div>
                                    <div class="flex space-x-2 pt-2">
                                        ${d.ficheiroUrl ? `<button onclick="app.previewDoc('${d.id}')" class="w-full py-1.5 bg-slate-800 hover:bg-slate-700 text-xs font-medium text-slate-200 rounded-lg">Pré-visualizar</button>` : '<span class="text-xs text-slate-500">Sem ficheiro associado</span>'}
                                        <button onclick="app.deleteDoc('${d.id}')" class="px-2 py-1.5 bg-rose-500/10 text-rose-400 rounded-lg text-xs"><i class="fa-solid fa-trash-can"></i></button>
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                `;
            },

            openDocumentoModal: function() {
                const html = `
                    <form onsubmit="app.saveDocumento(event)" class="space-y-4">
                        <div>
                            <label class="block text-xs font-medium text-slate-400 mb-1">Título do Documento</label>
                            <input type="text" id="doc-titulo" required class="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-sm text-white focus:border-emerald-500 outline-none">
                        </div>
                        <div>
                            <label class="block text-xs font-medium text-slate-400 mb-1">Categoria / Pasta</label>
                            <select id="doc-categoria" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-sm text-white focus:border-emerald-500 outline-none">
                                <option value="Atas">Atas de Assembleia</option>
                                <option value="Regulamentos">Regulamentos</option>
                                <option value="Contratos">Contratos de Fornecedores</option>
                                <option value="Outros">Outros Documentos</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-xs font-medium text-slate-400 mb-1">Anexo / Imagem (Compressão Automática)</label>
                            <input type="file" id="doc-file" accept="image/*" class="w-full text-xs text-slate-400 file:mr-4 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-semibold file:bg-slate-800 file:text-slate-200 hover:file:bg-slate-700">
                        </div>
                        <div class="flex justify-end space-x-3 pt-4">
                            <button type="button" onclick="app.closeModal()" class="px-4 py-2 bg-slate-800 text-slate-300 rounded-xl text-xs font-semibold">Cancelar</button>
                            <button type="submit" class="px-4 py-2 bg-emerald-600 text-white rounded-xl text-xs font-semibold">Guardar Documento</button>
                        </div>
                    </form>
                `;
                this.openModal('Anexar Novo Documento', html);
            },

            saveDocumento: async function(e) {
                e.preventDefault();
                const fileInput = document.getElementById('doc-file');
                let compressedBase64 = '';

                if (fileInput.files.length > 0) {
                    try {
                        compressedBase64 = await DataUtils.compressImage(fileInput.files[0]);
                    } catch (err) {
                        console.warn('Ficheiro não é uma imagem processável. A guardar sem preview.', err);
                    }
                }

                const payload = {
                    titulo: document.getElementById('doc-titulo').value,
                    categoria: document.getElementById('doc-categoria').value,
                    dataUpload: new Date().toISOString().split('T')[0],
                    ficheiroUrl: compressedBase64,
                    tamanho: compressedBase64 ? 'Compressed JPG' : 'Doc Text'
                };

                DBRepository.insert('documentos', payload);
                this.closeModal();
                this.showToast('Documento guardado no repositório.');
                this.navigate('documentos');
            },

            previewDoc: function(id) {
                const doc = DBRepository.getCollection('documentos').find(d => d.id === id);
                if (doc && doc.ficheiroUrl) {
                    const html = `<div class="flex justify-center"><img src="${doc.ficheiroUrl}" class="max-h-96 rounded-xl border border-slate-800 shadow-lg"></div>`;
                    this.openModal(doc.titulo, html);
                }
            },

            deleteDoc: function(id) {
                if (confirm('Eliminar documento?')) {
                    DBRepository.delete('documentos', id);
                    this.showToast('Documento removido.');
                    this.navigate('documentos');
                }
            },

            // --- 6. CONTAS BANCAIRAS & FORMAS MONETÁRIAS ---
            renderBancos: function(container) {
                const contas = DBRepository.getCollection('contasBancarias');
                const formas = DBRepository.getCollection('formasPagamento');

                container.innerHTML = `
                    <div class="space-y-6">
                        <div>
                            <h2 class="text-xl font-bold text-white">Contas Bancárias & Meios de Pagamento</h2>
                            <p class="text-xs text-slate-400">Configuração de contas de tesouraria, fundo de reserva e métodos monetários.</p>
                        </div>

                        <!-- Contas Bancarias -->
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                            ${contas.map(c => `
                                <div class="bg-slate-900 border border-slate-800 rounded-2xl p-5 space-y-3">
                                    <div class="flex justify-between items-start">
                                        <div>
                                            <h3 class="font-bold text-white text-base">${c.banco}</h3>
                                            <span class="text-xs text-slate-400">${c.tipo}</span>
                                        </div>
                                        <span class="text-xs font-mono text-emerald-400 font-bold">${DataUtils.formatCurrency(c.saldoInicial)}</span>
                                    </div>
                                    <p class="text-xs font-mono text-slate-400 pt-2 border-t border-slate-800">IBAN: ${c.iban}</p>
                                </div>
                            `).join('')}
                        </div>

                        <!-- Formas Monetarias -->
                        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6">
                            <h3 class="text-base font-semibold text-white mb-3">Formas Monetárias Aceites</h3>
                            <ul class="divide-y divide-slate-800">
                                ${formas.map(f => `
                                    <li class="py-2.5 flex justify-between items-center text-sm text-slate-300">
                                        <span><i class="fa-solid fa-money-check-dollar mr-2 text-slate-500"></i>${f.nome}</span>
                                        <span class="text-xs px-2 py-0.5 rounded bg-emerald-500/10 text-emerald-400">Ativo</span>
                                    </li>
                                `).join('')}
                            </ul>
                        </div>
                    </div>
                `;
            },

            // --- 7. RELATÓRIOS & DRE CONDOMINIAL ---
            renderRelatorios: function(container) {
                const financeiro = DBRepository.getCollection('financeiro');
                const totalReceitas = financeiro.filter(f => f.tipo === 'RECEBER').reduce((acc, c) => acc + c.valorPago, 0);
                const totalDespesas = financeiro.filter(f => f.tipo === 'PAGAR').reduce((acc, c) => acc + c.valorPago, 0);
                const resultadoOperacional = totalReceitas - totalDespesas;

                container.innerHTML = `
                    <div class="space-y-6">
                        <div>
                            <h2 class="text-xl font-bold text-white">Demonstrativo de Resultados (DRE Condominial)</h2>
                            <p class="text-xs text-slate-400">Visão consolidada de caixa e liquidações efetivas.</p>
                        </div>

                        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 max-w-2xl mx-auto space-y-4">
                            <h3 class="text-base font-bold text-white border-b border-slate-800 pb-3 text-center">DRE Simplificado - Exercício Atual</h3>
                            
                            <div class="space-y-3 text-sm">
                                <div class="flex justify-between items-center text-slate-300">
                                    <span>(+) Receitas Liquidadas</span>
                                    <span class="font-semibold text-emerald-400">${DataUtils.formatCurrency(totalReceitas)}</span>
                                </div>
                                <div class="flex justify-between items-center text-slate-300">
                                    <span>(-) Despesas Pagas</span>
                                    <span class="font-semibold text-rose-400">${DataUtils.formatCurrency(totalDespesas)}</span>
                                </div>
                                <div class="pt-3 border-t border-slate-800 flex justify-between items-center font-bold text-base">
                                    <span class="text-white font-bold">(=) Resultado Líquido do Período</span>
                                    <span class="${resultadoOperacional >= 0 ? 'text-emerald-400' : 'text-rose-400'}">${DataUtils.formatCurrency(resultadoOperacional)}</span>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            },

            // --- 8. GESTÃO DE UTILIZADORES ---
            renderUtilizadores: function(container) {
                const users = DBRepository.getCollection('utilizadores');
                container.innerHTML = `
                    <div class="space-y-6">
                        <div>
                            <h2 class="text-xl font-bold text-white">Gestão de Utilizadores e Segurança</h2>
                            <p class="text-xs text-slate-400">Controlo de perfis e acessos à plataforma.</p>
                        </div>

                        <div class="bg-slate-900 border border-slate-800 rounded-2xl overflow-hidden shadow-xl">
                            <table class="w-full text-left text-sm text-slate-300">
                                <thead class="bg-slate-950/50 text-xs uppercase text-slate-400 border-b border-slate-800">
                                    <tr>
                                        <th class="px-6 py-3">Nome</th>
                                        <th class="px-6 py-3">E-mail</th>
                                        <th class="px-6 py-3">Perfil</th>
                                        <th class="px-6 py-3">Último Acesso</th>
                                    </tr>
                                </thead>
                                <tbody class="divide-y divide-slate-800">
                                    ${users.map(u => `
                                        <tr>
                                            <td class="px-6 py-4 font-semibold text-white">${u.nome}</td>
                                            <td class="px-6 py-4 text-slate-400">${u.email}</td>
                                            <td class="px-6 py-4"><span class="px-2 py-0.5 rounded text-xs bg-slate-800 border border-slate-700 text-slate-200">${u.perfil}</span></td>
                                            <td class="px-6 py-4 text-slate-400">${DataUtils.formatDate(u.ultimoAcesso)}</td>
                                        </tr>
                                    `).join('')}
                                </tbody>
                            </table>
                        </div>
                    </div>
                `;
            }
        };

        // Initialize application on DOM load
        window.onload = () => {
            app.init();
        };
    </script>
</body>
</html>
