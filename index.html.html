        class DBRepository {
            static load() {
                try {
                    const rawData = localStorage.getItem(STORAGE_KEY);
                    if (!rawData) return DEFAULT_DATA;
                    const parsed = JSON.parse(rawData);
                    if (!parsed.patrimonio) parsed.patrimonio = DEFAULT_DATA.patrimonio;
                    if (!parsed.estoque) parsed.estoque = DEFAULT_DATA.estoque;
                    if (!parsed.movimentacoes_estoque) parsed.movimentacoes_estoque = DEFAULT_DATA.movimentacoes_estoque;
                    if (!parsed.financeiro) parsed.financeiro = DEFAULT_DATA.financeiro;
                    if (!parsed.logs) parsed.logs = DEFAULT_DATA.logs;
                    return parsed;
                } catch (e) { return DEFAULT_DATA; }
            }

            static save(data) {
                try {
                    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
                    return true;
                } catch (e) {
                    alert('Aviso: Limite de armazenamento atingido.');
                    return false;
                }
            }
        }

        let db = DBRepository.load();
        let sessao = { usuarioLogado: null };

        try {
            const sessaoData = sessionStorage.getItem('guardioes_sessao');
            if (sessaoData) sessao.usuarioLogado = JSON.parse(sessaoData);
            else sessao.usuarioLogado = db.usuarios[0];

        function escapeHTML(str) {
            if (typeof str !== 'string') return str || '';
            return str.replace(/[&<>"']/g, function(m) {
                return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[m];
            });
        }

        function salvarDados(data) { DBRepository.save(data); }

        function registrarLog(modulo, acao, detalhe) {
            const usuario = sessao.usuarioLogado ? sessao.usuarioLogado.usuario : 'Sistema';
            const dataHora = new Date().toLocaleString('pt-BR');
            db.logs.unshift({ id: 'log_' + Date.now(), dataHora, modulo, acao, usuario, detalhe });
            if (db.logs.length > 50) db.logs.pop();
            salvarDados(db);
        }

        function processarUploadBase64(event, targetImgId) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                comprimirImagem(e.target.result, 800, 0.7, (compressedBase64) => {
                    tempBase64 = compressedBase64;
                    const imgEl = document.getElementById(targetImgId);
                    if (imgEl) {
                        imgEl.src = tempBase64;
                        imgEl.classList.remove('hidden');
                    }
                });
            };
            reader.readAsDataURL(file);
        }

        function comprimirImagem(base64Str, maxWidth, quality, callback) {
            const img = new Image();
            img.src = base64Str;
            img.onload = () => {
                let width = img.width;
                let height = img.height;
                if (width > maxWidth) {
                    height = Math.round((height * maxWidth) / width);
                    width = maxWidth;
                }
                const canvas = document.createElement('canvas');
                canvas.width = width;
                canvas.height = height;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(img, 0, 0, width, height);
                callback(canvas.toDataURL('image/jpeg', quality));
            };
        }

                    html5QrCodeScannerInstance.render((decodedText) => {
                        if (callbackTargetInputId) {
                            const target = document.getElementById(callbackTargetInputId);
                            if (target) target.value = decodedText;
                        } else {
                            if (tabsState.activeTab === 'estoque') {
                                if (abaEstoqueInterna === 'consumo') estFiltros.busca = decodedText;
                                else patFiltros.busca = decodedText;
                            }
                        }
                        fecharModalScannerBarcode();
                        renderApp();
                    }, (err) => {});
                } else {
                    alert('Biblioteca do leitor de código de barras indisponível.');
                    fecharModalScannerBarcode();
                }
            }, 200);
        }

        function fecharModalScannerBarcode() {
            if (html5QrCodeScannerInstance) {
                html5QrCodeScannerInstance.clear().catch(e => console.error(e));
                html5QrCodeScannerInstance = null;
            }
            const modal = document.getElementById('modal_barcode');
            if (modal) modal.remove();

                `*Produto:* ${item.item}\n` +
                `*Categoria:* ${item.categoria}\n` +

                `*Localização:* ${item.localizacao || 'Almoxarifado'}\n\n` +
                `_Favor providenciar a reposição deste item o mais rápido possível._`;

            const urlWhatsApp = `https://wa.me/${db.configuracoes.whatsappNotificacao}?text=${encodeURIComponent(textoMensagem)}`;
            window.open(urlWhatsApp, '_blank');
        }

        function renderDashboardCharts() {
            const ctxFluxo = document.getElementById('chartFluxo');

            if (chartFluxoInstance) chartFluxoInstance.destroy();
            if (chartDespesasInstance) chartDespesasInstance.destroy();

            if (ctxFluxo) {
                chartFluxoInstance = new Chart(ctxFluxo, {
                    type: 'line',
                    data: {
                        labels: ['Semana 1', 'Semana 2', 'Semana 3', 'Semana 4'],
                        datasets: [
                            { label: 'Receitas (R$)', data: [12000, 25000, 31000, 38750], borderColor: '#0d9488', backgroundColor: 'rgba(13, 148, 136, 0.1)', tension: 0.4, fill: true, borderWidth: 3 },
                            { label: 'Despesas (R$)', data: [2100, 4500, 6800, 7350], borderColor: '#e11d48', backgroundColor: 'rgba(225, 29, 72, 0.05)', tension: 0.4, fill: true, borderWidth: 3 }

                    },
                    options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'bottom' } } }
                });
            }

            if (ctxDespesas) {
                chartDespesasInstance = new Chart(ctxDespesas, {
                    type: 'doughnut',
                    data: {
                        labels: ['Manutenção Elevadores', 'Energia Elétrica', 'Limpeza & Piscina', 'Outros'],
                        datasets: [{ data: [3200, 4150, 1800, 1200], backgroundColor: ['#0f766e', '#f59e0b', '#0284c7', '#64748b'] }]

                    options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'bottom' } } }

                                <input type="text" id="mov_resp" required value="${escapeHTML(sessao.usuarioLogado.nome)}" class="w-full p-2.5 border rounded-xl text-xs font-bold">
                            </div>

                            <div class="flex items-center justify-end gap-2 pt-3 border-t">
                                <button type="button" onclick="fecharModal('modal_mov')" class="px-4 py-2 bg-slate-200 rounded-xl text-xs font-bold">Cancelar</button>
                                <button type="submit" class="px-5 py-2 ${tipo === 'Entrada' ? 'bg-teal-600 hover:bg-teal-700' : 'bg-rose-600 hover:bg-rose-700'} text-white rounded-xl text-xs font-bold shadow">
                                    Confirmar ${tipo}
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            `;
            document.body.insertAdjacentHTML('beforeend', html);
        }

        function salvarMovimentacaoEstoque(e, tipo) {
            e.preventDefault();
            const produtoId = document.getElementById('mov_prod').value;
            const qtd = parseInt(document.getElementById('mov_qtd').value) || 0;
            const motivo = document.getElementById('mov_motivo').value.trim();
            const responsavel = document.getElementById('mov_resp').value.trim();

            const produto = db.estoque.find(x => x.id === produtoId);
            if (!produto) return;

            if (tipo === 'Saida' && produto.qtd < qtd) {
                alert('Atenção: A quantidade de saída é maior do que o estoque disponível!');
                return;
            }

            if (tipo === 'Entrada') produto.qtd += qtd;
            else produto.qtd -= qtd;

            const dataHora = new Date().toLocaleString('pt-BR');
            db.movimentacoes_estoque.unshift({ id: 'mov_' + Date.now(), produtoId, tipo, qtd, motivo, responsavel, dataHora });
            registrarLog('Estoque', `${tipo} Registrada`, `${qtd} un. de ${produto.item}`);

            salvarDados(db); fecharModal('modal_mov'); renderApp();
        }

        function renderModalEstoque(itemId = null) {
            const e = itemId ? db.estoque.find(x => x.id === itemId) : null;
            tempBase64 = e ? (e.fotoBase64 || '') : '';

            const html = `
                <div id="modal_est" class="fixed inset-0 bg-slate-950/70 z-50 flex items-center justify-center p-4">
                    <div class="bg-white w-full max-w-md rounded-2xl shadow-2xl overflow-hidden flex flex-col max-h-[90vh]">
                        <div class="p-4 bg-slate-900 text-white flex items-center justify-between">
                            <h3 class="font-bold text-sm">${e ? 'Editar Produto' : 'Novo Produto de Consumo'}</h3>
                            <button onclick="fecharModal('modal_est')" class="text-slate-400 hover:text-white"><i class="fa-solid fa-xmark"></i></button>
                        </div>
                        <form onsubmit="salvarEstoqueForm(event, '${itemId || ''}')" class="p-6 space-y-3 overflow-y-auto">
                            <div><label class="block text-xs font-bold uppercase mb-1">Nome do Produto</label><input type="text" id="est_item" required value="${e ? escapeHTML(e.item) : ''}" class="w-full p-2 border rounded text-xs font-bold"></div>
                            
                            <div>
                                <label class="block text-xs font-bold uppercase mb-1">Código de Barras</label>
                                <div class="flex gap-2">
                                    <input type="text" id="est_barcode" value="${e ? escapeHTML(e.codigoBarras || '') : ''}" placeholder="Digite ou escaneie..." class="w-full p-2 border rounded text-xs font-bold font-mono">
                                    <button type="button" onclick="abrirModalScannerBarcode('est_barcode')" class="px-3 py-2 bg-slate-800 text-teal-400 rounded font-bold text-xs"><i class="fa-solid fa-barcode"></i> Câmera</button>
                                </div>
                            </div>

                            <div class="grid grid-cols-2 gap-3">
                                <div><label class="block text-xs font-bold uppercase mb-1">Qtd Atual</label><input type="number" id="est_qtd" required value="${e ? e.qtd : 10}" class="w-full p-2 border rounded text-xs font-bold"></div>
                                <div><label class="block text-xs font-bold uppercase mb-1">Qtd Mínima</label><input type="number" id="est_min" required value="${e ? e.minimo : 5}" class="w-full p-2 border rounded text-xs font-bold"></div>
                            </div>

                            <div class="border-2 border-dashed border-teal-300 rounded-xl p-3 text-center bg-teal-50/50 space-y-2">
                                <label class="block text-xs font-bold text-teal-800 uppercase">Foto do Produto (Câmera / Galeria)</label>
                                <div class="flex gap-2 justify-center">
                                    <label class="px-3 py-1.5 bg-teal-700 text-white rounded text-xs font-bold cursor-pointer inline-flex items-center gap-1 shadow">
                                        <i class="fa-solid fa-camera"></i> Câmera
                                        <input type="file" accept="image/*" capture="environment" class="hidden" onchange="processarUploadBase64(event, 'preview_est_img')">
                                    </label>
                                    <label class="px-3 py-1.5 bg-slate-800 text-white rounded text-xs font-bold cursor-pointer inline-flex items-center gap-1 shadow">
                                        <i class="fa-solid fa-image"></i> Galeria
                                        <input type="file" accept="image/*" class="hidden" onchange="processarUploadBase64(event, 'preview_est_img')">
                                    </label>
                                </div>
                                <div class="flex justify-center mt-1">
                                    <img id="preview_est_img" src="${tempBase64 || ''}" class="max-h-28 object-contain rounded border ${tempBase64 ? '' : 'hidden'}" />
                                </div>
                            </div>

                            <div class="flex items-center justify-end gap-2 pt-3 border-t">
                                <button type="button" onclick="fecharModal('modal_est')" class="px-3 py-2 bg-slate-200 rounded text-xs font-bold">Cancelar</button>
                                <button type="submit" class="px-4 py-2 bg-teal-600 text-white rounded text-xs font-bold shadow">Salvar Produto</button>
                            </div>
                        </form>
                    </div>
                </div>
            `;
            document.body.insertAdjacentHTML('beforeend', html);
        }

        function salvarEstoqueForm(ev, itemId = '') {
            ev.preventDefault();
            const item = document.getElementById('est_item').value.trim();
            const codigoBarras = document.getElementById('est_barcode').value.trim();
            const qtd = parseInt(document.getElementById('est_qtd').value) || 0;
            const min = parseInt(document.getElementById('est_min').value) || 0;

            if (itemId) {
                const e = db.estoque.find(x => x.id === itemId);
                if (e) { e.item = item; e.codigoBarras = codigoBarras; e.qtd = qtd; e.minimo = min; e.fotoBase64 = tempBase64; }
            } else {
                db.estoque.push({ id: 'est_' + Date.now(), item, codigoBarras, categoria: 'Geral', qtd, minimo: min, fotoBase64: tempBase64 });
            }

            salvarDados(db); fecharModal('modal_est'); renderApp();
        }

        function renderModalPatrimonio(patId = null) {
            const p = patId ? db.patrimonio.find(x => x.id === patId) : null;
            tempBase64 = p ? (p.fotoBase64 || '') : '';

            const html = `
                <div id="modal_pat" class="fixed inset-0 bg-slate-950/70 z-50 flex items-center justify-center p-4">
                    <div class="bg-white w-full max-w-lg rounded-2xl shadow-2xl overflow-hidden flex flex-col max-h-[90vh]">
                        <div class="p-4 bg-slate-900 text-white flex items-center justify-between">
                            <h3 class="font-bold text-sm"><i class="fa-solid fa-couch mr-2 text-teal-400"></i> ${p ? 'Editar Bem / Ocorrência' : 'Novo Bem Patrimonial'}</h3>
                            <button onclick="fecharModal('modal_pat')" class="text-slate-400 hover:text-white"><i class="fa-solid fa-xmark"></i></button>
                        </div>
                        <form onsubmit="salvarPatrimonioForm(event, '${patId || ''}')" class="p-6 space-y-3 overflow-y-auto">
                            <div class="grid grid-cols-2 gap-3">
                                <div><label class="block text-xs font-bold uppercase mb-1">Cód. Tombamento</label><input type="text" id="pat_tomb" required value="${p ? escapeHTML(p.tombamento) : 'PAT-' + Math.floor(100 + Math.random() * 900)}" class="w-full p-2 border rounded text-xs font-bold font-mono"></div>
                                <div>
                                    <label class="block text-xs font-bold uppercase mb-1">Conservação / Situação</label>
                                    <select id="pat_cons" class="w-full p-2 border rounded text-xs font-bold bg-white">
                                        <option value="Novo" ${p && p.conservacao === 'Novo' ? 'selected' : ''}>Novo</option>
                                        <option value="Bom" ${!p || (p && p.conservacao === 'Bom') ? 'selected' : ''}>Bom</option>
                                        <option value="Regular" ${p && p.conservacao === 'Regular' ? 'selected' : ''}>Regular</option>
                                        <option value="Quebrado" ${p && p.conservacao === 'Quebrado' ? 'selected' : ''}>Quebrado / Danificado</option>
                                        <option value="Extraviado" ${p && p.conservacao === 'Extraviado' ? 'selected' : ''}>Extraviado / Sumido</option>
                                        <option value="Inservível" ${p && p.conservacao === 'Inservível' ? 'selected' : ''}>Inservível / Sucata</option>
                                    </select>
                                </div>
                            </div>

                            <div><label class="block text-xs font-bold uppercase mb-1">Nome do Bem / Móvel</label><input type="text" id="pat_nome" required value="${p ? escapeHTML(p.nome) : ''}" placeholder="Ex: Cadeira Salão de Festas" class="w-full p-2 border rounded text-xs font-bold"></div>
                            <div><label class="block text-xs font-bold uppercase mb-1">Localização no Condomínio</label><input type="text" id="pat_loc" required value="${p ? escapeHTML(p.localizacao) : ''}" placeholder="Ex: Salão de Festas" class="w-full p-2 border rounded text-xs font-bold"></div>

                            <div>
                                <label class="block text-xs font-bold uppercase mb-1">Detalhes da Ocorrência / Motivo</label>
                                <textarea id="pat_just" rows="2" placeholder="Se estiver quebrado ou extraviado, descreva o motivo..." class="w-full p-2 border rounded text-xs font-bold">${p ? escapeHTML(p.justificativa || '') : ''}</textarea>
                            </div>

                            <div class="border-2 border-dashed border-teal-300 rounded-xl p-3 text-center bg-teal-50/50 space-y-2">
                                <label class="block text-xs font-bold text-teal-800 uppercase">Foto do Bem (Câmera / Galeria)</label>
                                <div class="flex gap-2 justify-center">
                                    <label class="px-3 py-1.5 bg-teal-700 text-white rounded text-xs font-bold cursor-pointer inline-flex items-center gap-1 shadow">
                                        <i class="fa-solid fa-camera"></i> Câmera
                                        <input type="file" accept="image/*" capture="environment" class="hidden" onchange="processarUploadBase64(event, 'preview_pat_img')">
                                    </label>
                                    <label class="px-3 py-1.5 bg-slate-800 text-white rounded text-xs font-bold cursor-pointer inline-flex items-center gap-1 shadow">
                                        <i class="fa-solid fa-image"></i> Galeria
                                        <input type="file" accept="image/*" class="hidden" onchange="processarUploadBase64(event, 'preview_pat_img')">
                                    </label>
                                </div>
                                <div class="flex justify-center mt-1">
                                    <img id="preview_pat_img" src="${tempBase64 || ''}" class="max-h-28 object-contain rounded border ${tempBase64 ? '' : 'hidden'}" />
                                </div>
                            </div>

                            <div class="flex items-center justify-end gap-2 pt-3 border-t">
                                <button type="button" onclick="fecharModal('modal_pat')" class="px-3 py-2 bg-slate-200 rounded text-xs font-bold">Cancelar</button>
                                <button type="submit" class="px-4 py-2 bg-teal-600 hover:bg-teal-700 text-white rounded text-xs font-bold shadow">Salvar no Inventário</button>
                            </div>
                        </form>
                    </div>
                </div>
            `;
            document.body.insertAdjacentHTML('beforeend', html);
        }

        function salvarPatrimonioForm(e, patId = '') {
            e.preventDefault();
            const tombamento = document.getElementById('pat_tomb').value.trim();
            const conservacao = document.getElementById('pat_cons').value;
            const nome = document.getElementById('pat_nome').value.trim();
            const localizacao = document.getElementById('pat_loc').value.trim();
            const justificativa = document.getElementById('pat_just').value.trim();

            if (patId) {
                const p = db.patrimonio.find(x => x.id === patId);
                if (p) { p.tombamento = tombamento; p.conservacao = conservacao; p.nome = nome; p.localizacao = localizacao; p.justificativa = justificativa; p.fotoBase64 = tempBase64; }
            } else {
                db.patrimonio.push({ id: 'pat_' + Date.now(), tombamento, conservacao, nome, localizacao, justificativa, fotoBase64: tempBase64 });
            }

            salvarDados(db); fecharModal('modal_pat'); renderApp();
        }

        function renderFinanceiroModule() {
            return `<div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 font-bold text-xs text-slate-600">Módulo Financeiro Ativo.</div>`;
        }

        function renderMoradoresModule() {
            return `<div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 font-bold text-xs text-slate-600">Módulo de Moradores Ativo.</div>`;
        }

        function fecharModal(id) {
            const el = document.getElementById(id);
            if (el) el.remove();
        }

        function iniciarAplicacao() { renderApp(); }
        if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', iniciarAplicacao);
        else iniciarAplicacao();
    </script>
</body>
</html>
