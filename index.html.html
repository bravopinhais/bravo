<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guardiões do Bravo - Gestão Condominial Segura</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Chart.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- HTML5 Barcode/QR Code Reader CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
    <style>
        html, body { height: 100%; margin: 0; padding: 0; }
        input, select, textarea { color: #0f172a !important; font-weight: 600 !important; }
        .tab-active { border-bottom: 3px solid #0d9488; background-color: #ffffff; color: #0f766e; font-weight: 700; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #f1f5f9; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        .sidebar-full { height: 100vh; position: sticky; top: 0; }
        @media print {
            aside, header, .no-print, button, .actions-col { display: none !important; }
            body { background: white !important; color: black !important; }
            main { padding: 0 !important; }
            .print-break { page-break-before: always; }
        }
    </style>
</head>
<body class="bg-slate-100 font-sans antialiased text-slate-800 min-h-screen flex flex-col">

    <div id="app" class="flex-1 flex flex-col min-h-screen"></div>

    <script>
        const STORAGE_KEY = 'guardioes_bravo_db';
        let tempBase64 = '';
        let html5QrCodeScannerInstance = null;

        const DEFAULT_DATA = {
            configuracoes: { whatsappNotificacao: '5541999999999' },
            usuarios: [
                { id: 'usr_admin', usuario: 'admin', nome: 'Administrador Principal', email: 'admin@guardioes.com', perfil: 'Admin', status: 'Ativo', primeiroAcesso: false, senhaHash: 'Admin@12345' }
            ],
            financeiro: [],
            formas_monetarias: [],
            contas_bancarias: [],
            moradores: [],
            categorias: [
                { id: 'cat_4', nome: 'Elétrica', modulo: 'Estoque' },
                { id: 'cat_5', nome: 'Piscina', modulo: 'Estoque' }
            ],
            estoque: [
                { id: 'est_1', item: 'Lâmpada LED 12W', codigoBarras: '7891234567890', categoria: 'Elétrica', qtd: 4, minimo: 10, maximo: 50, localizacao: 'Almoxarifado Central', proximaContagem: '2026-10-25', fotoBase64: '' },
                { id: 'est_2', item: 'Cloro Granulado 10kg', codigoBarras: '7899876543210', categoria: 'Piscina', qtd: 15, minimo: 5, maximo: 30, localizacao: 'DML Piscina', proximaContagem: '2026-11-01', fotoBase64: '' }
            ],
            documentos: [],
            dre_config: [],
            logs: []
        };

        class DBRepository {
            static load() {
                try {
                    const rawData = localStorage.getItem(STORAGE_KEY);
                    if (!rawData) return DEFAULT_DATA;
                    const parsed = JSON.parse(rawData);
                    if (!parsed.estoque) parsed.estoque = DEFAULT_DATA.estoque;
                    return parsed;
                } catch (e) { return DEFAULT_DATA; }
            }

            static save(data) {
                try {
                    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
                    return true;
                } catch (e) {
                    alert('Aviso: Limite de armazenamento excedido.');
                    return false;
                }
            }
        }

        let db = DBRepository.load();
        let sessao = { usuarioLogado: null };

        try {
            const sessaoData = sessionStorage.getItem('guardioes_sessao');
            if (sessaoData) sessao.usuarioLogado = JSON.parse(sessaoData);
        } catch (e) { sessao.usuarioLogado = null; }

        let tabsState = { openTabs: ['estoque'], activeTab: 'estoque' };
        let estFiltros = { categoria: 'Todas', status: 'Todos', busca: '' };

        const MODULE_NAMES = { estoque: 'Estoque de Produtos' };

        function escapeHTML(str) {
            if (typeof str !== 'string') return str || '';
            return str.replace(/[&<>"']/g, function(m) {
                return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[m];
            });
        }

        function salvarDados(data) { DBRepository.save(data); }

        // LEITOR DE CÓDIGO DE BARRAS VIA CÂMERA
        function abrirModalScannerBarcode(callbackTargetInputId) {
            const html = `
                <div id="modal_barcode" class="fixed inset-0 bg-slate-900/90 z-[70] flex items-center justify-center p-4">
                    <div class="bg-white w-full max-w-sm rounded-2xl shadow-2xl overflow-hidden flex flex-col">
                        <div class="p-4 bg-slate-900 text-white flex items-center justify-between">
                            <h3 class="font-bold text-sm"><i class="fa-solid fa-barcode text-teal-400 mr-2"></i> Ler Código de Barras</h3>
                            <button onclick="fecharModalScannerBarcode()" class="text-slate-400 hover:text-white"><i class="fa-solid fa-xmark"></i></button>
                        </div>
                        <div class="p-4 flex flex-col items-center">
                            <div id="barcode_reader" class="w-full bg-slate-100 rounded-lg overflow-hidden border"></div>
                            <p class="text-xs text-slate-500 mt-2 text-center font-bold">Aponte a câmera para o código de barras do produto.</p>
                        </div>
                        <div class="p-3 bg-slate-50 border-t flex justify-end">
                            <button onclick="fecharModalScannerBarcode()" class="px-4 py-2 bg-slate-700 text-white rounded text-xs font-bold">Cancelar</button>
                        </div>
                    </div>
                </div>
            `;
            document.body.insertAdjacentHTML('beforeend', html);

            setTimeout(() => {
                if (typeof Html5QrcodeScanner !== 'undefined') {
                    html5QrCodeScannerInstance = new Html5QrcodeScanner("barcode_reader", { fps: 10, qrbox: { width: 250, height: 150 } });
                    html5QrCodeScannerInstance.render((decodedText) => {
                        if (callbackTargetInputId) {
                            const target = document.getElementById(callbackTargetInputId);
                            if (target) target.value = decodedText;
                        } else {
                            // Se for busca direta
                            estFiltros.busca = decodedText;
                        }
                        fecharModalScannerBarcode();
                        renderApp();
                    }, (err) => {});
                } else {
                    alert('Biblioteca do leitor de código de barras não foi carregada.');
                    fecharModalScannerBarcode();
                }
            }, 200);
        }

        function fecharModalScannerBarcode() {
            if (html5QrCodeScannerInstance) {
                html5QrCodeScannerInstance.clear().catch(e => console.error(e));
                html5QrCodeScannerInstance = null;
            }
            const modal = document.getElementById('modal_barcode');
            if (modal) modal.remove();
        }

        function abrirModulo(moduloId) {
            tabsState.activeTab = moduloId;
            renderApp();
        }

        function renderApp() {
            const container = document.getElementById('app');
            if (!container) return;

            container.innerHTML = `
                <div class="flex-1 flex flex-col min-h-screen">
                    <header class="bg-slate-900 text-white p-4 flex items-center justify-between">
                        <div class="flex items-center gap-3">
                            <div class="w-8 h-8 rounded bg-teal-600 flex items-center justify-center font-bold"><i class="fa-solid fa-shield-halved"></i></div>
                            <h1 class="font-bold text-sm">Guardiões do Bravo - Módulo Estoque</h1>
                        </div>
                    </header>
                    <main class="flex-1 p-4 md:p-6 bg-slate-100">
                        ${renderEstoqueView()}
                    </main>
                </div>
            `;
        }

        function renderEstoqueView() {
            let list = db.estoque || [];

            if (estFiltros.busca.trim() !== '') {
                const b = estFiltros.busca.toLowerCase();
                list = list.filter(e => 
                    (e.item || '').toLowerCase().includes(b) || 
                    (e.codigoBarras || '').toLowerCase().includes(b) ||
                    (e.localizacao || '').toLowerCase().includes(b)
                );
            }

            return `
                <div class="space-y-4">
                    <!-- BARRA DE PESQUISA COM BOTÃO DE SCANNER -->
                    <div class="bg-white p-4 rounded-xl shadow-sm border flex flex-col sm:flex-row gap-3 items-center justify-between">
                        <div class="flex-1 w-full flex items-center gap-2">
                            <input type="text" id="flt_est_busca" value="${escapeHTML(estFiltros.busca)}" placeholder="Buscar por Nome ou Código de Barras..." oninput="atualizarFiltroBuscaEstoque()" class="w-full p-2.5 border rounded-lg text-xs font-bold">
                            <button onclick="abrirModalScannerBarcode(null)" title="Escanear com Câmera" class="px-4 py-2.5 bg-slate-900 hover:bg-slate-800 text-white rounded-lg text-xs font-bold shadow flex items-center gap-2 whitespace-nowrap">
                                <i class="fa-solid fa-barcode text-teal-400"></i> Escanear Câmera
                            </button>
                        </div>
                        <button onclick="renderModalEstoque()" class="w-full sm:w-auto px-4 py-2.5 bg-teal-600 hover:bg-teal-700 text-white rounded-lg text-xs font-bold shadow flex items-center gap-2 justify-center">
                            <i class="fa-solid fa-plus"></i> Novo Item
                        </button>
                    </div>

                    <!-- TABELA DE PRODUTOS -->
                    <div class="bg-white rounded-xl shadow-sm border overflow-hidden">
                        <div class="overflow-x-auto">
                            <table class="w-full text-left text-xs">
                                <thead class="bg-slate-100 font-bold uppercase border-b">
                                    <tr>
                                        <th class="p-3">Item / Produto</th>
                                        <th class="p-3">Código de Barras</th>
                                        <th class="p-3">Categoria</th>
                                        <th class="p-3">Qtd</th>
                                        <th class="p-3 text-right">Ações</th>
                                    </tr>
                                </thead>
                                <tbody class="divide-y">
                                    ${list.length === 0 ? `<tr><td colspan="5" class="p-6 text-center text-slate-500 font-bold">Nenhum produto encontrado.</td></tr>` : ''}
                                    ${list.map(e => `
                                        <tr class="hover:bg-slate-50">
                                            <td class="p-3 font-bold text-slate-900">${escapeHTML(e.item)}</td>
                                            <td class="p-3 font-mono text-slate-600">${e.codigoBarras ? `<i class="fa-solid fa-barcode mr-1 text-slate-400"></i> ${escapeHTML(e.codigoBarras)}` : '<span class="text-slate-400 italic">Sem código</span>'}</td>
                                            <td class="p-3"><span class="px-2 py-0.5 rounded text-[10px] font-bold bg-slate-200">${escapeHTML(e.categoria)}</span></td>
                                            <td class="p-3 font-extrabold ${Number(e.qtd) <= Number(e.minimo) ? 'text-rose-600' : 'text-slate-800'}">${e.qtd}</td>
                                            <td class="p-3 text-right">
                                                <button onclick="renderModalEstoque('${e.id}')" class="p-1.5 text-blue-600 hover:bg-blue-50 rounded"><i class="fa-solid fa-pen-to-square"></i></button>
                                            </td>
                                        </tr>
                                    `).join('')}
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            `;
        }

        function atualizarFiltroBuscaEstoque() {
            estFiltros.busca = document.getElementById('flt_est_busca').value;
            renderApp();
        }

        function renderModalEstoque(itemId = null) {
            const e = itemId ? db.estoque.find(x => x.id === itemId) : null;
            const html = `
                <div id="modal_est" class="fixed inset-0 bg-slate-900/60 z-50 flex items-center justify-center p-4">
                    <div class="bg-white w-full max-w-md rounded-2xl shadow-xl overflow-hidden">
                        <div class="p-4 bg-slate-900 text-white flex items-center justify-between">
                            <h3 class="font-bold text-sm">${e ? 'Editar Item' : 'Novo Item com Código de Barras'}</h3>
                            <button onclick="fecharModal('modal_est')" class="text-slate-400 hover:text-white"><i class="fa-solid fa-xmark"></i></button>
                        </div>
                        <form onsubmit="salvarEstoqueForm(event, '${itemId || ''}')" class="p-6 space-y-3">
                            <div><label class="block text-xs font-bold uppercase mb-1">Nome do Produto</label><input type="text" id="est_item" required value="${e ? escapeHTML(e.item) : ''}" class="w-full p-2 border rounded text-xs font-bold"></div>
                            
                            <div>
                                <label class="block text-xs font-bold uppercase mb-1">Código de Barras (EAN-13 / QR)</label>
                                <div class="flex gap-2">
                                    <input type="text" id="est_barcode" value="${e ? escapeHTML(e.codigoBarras || '') : ''}" placeholder="Digite ou escaneie..." class="w-full p-2 border rounded text-xs font-bold font-mono">
                                    <button type="button" onclick="abrirModalScannerBarcode('est_barcode')" title="Ler Câmera" class="px-3 py-2 bg-slate-800 text-teal-400 hover:bg-slate-900 rounded font-bold text-xs flex items-center gap-1 whitespace-nowrap">
                                        <i class="fa-solid fa-barcode"></i> Ler Câmera
                                    </button>
                                </div>
                            </div>

                            <div class="grid grid-cols-2 gap-3">
                                <div><label class="block text-xs font-bold uppercase mb-1">Qtd Atual</label><input type="number" id="est_qtd" required value="${e ? e.qtd : 10}" class="w-full p-2 border rounded text-xs font-bold"></div>
                                <div><label class="block text-xs font-bold uppercase mb-1">Qtd Mínima</label><input type="number" id="est_min" required value="${e ? e.minimo : 5}" class="w-full p-2 border rounded text-xs font-bold"></div>
                            </div>

                            <div class="flex items-center justify-end gap-2 pt-3 border-t">
                                <button type="button" onclick="fecharModal('modal_est')" class="px-3 py-2 bg-slate-200 rounded text-xs font-bold">Cancelar</button>
                                <button type="submit" class="px-4 py-2 bg-teal-600 text-white rounded text-xs font-bold shadow">Salvar Item</button>
                            </div>
                        </form>
                    </div>
                </div>
            `;
            document.body.insertAdjacentHTML('beforeend', html);
        }

        function salvarEstoqueForm(ev, itemId = '') {
            ev.preventDefault();
            const item = document.getElementById('est_item').value.trim();
            const codigoBarras = document.getElementById('est_barcode').value.trim();
            const qtd = parseInt(document.getElementById('est_qtd').value) || 0;
            const min = parseInt(document.getElementById('est_min').value) || 0;

            if (itemId) {
                const e = db.estoque.find(x => x.id === itemId);
                if (e) { e.item = item; e.codigoBarras = codigoBarras; e.qtd = qtd; e.minimo = min; }
            } else {
                db.estoque.push({ id: 'est_' + Date.now(), item, codigoBarras, categoria: 'Geral', qtd, minimo: min });
            }

            salvarDados(db); fecharModal('modal_est'); renderApp();
        }

        function fecharModal(id) {
            const el = document.getElementById(id);
            if (el) el.remove();
        }

        function iniciarAplicacao() { renderApp(); }
        if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', iniciarAplicacao);
        else iniciarAplicacao();
    </script>
</body>
</html>
