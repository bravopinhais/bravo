<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guardiões do Bravo - Gestão Condominial</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #0f172a; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; }
        .input-dark-text { color: #0f172a !important; background-color: #f8fafc !important; font-weight: 500 !important; }
        .input-dark-text option { color: #0f172a !important; background-color: #ffffff !important; }
        @media print {
            body * { visibility: hidden; }
            #areaImpressao, #areaImpressao * { visibility: visible; }
            #areaImpressao { position: absolute; left: 0; top: 0; width: 100%; color: #000 !important; background: #fff !important; }
            .no-print { display: none !important; }
        }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 font-sans antialiased min-h-screen custom-scrollbar">

    <!-- ECRÃ DE LOGIN -->
    <div id="loginPage" class="flex items-center justify-center min-h-screen p-4 bg-slate-950">
        <div class="bg-slate-900 border border-slate-800 rounded-2xl shadow-2xl w-full max-w-md p-8">
            <div class="text-center mb-8">
                <div class="inline-flex items-center justify-center w-16 h-16 rounded-full bg-blue-600/20 text-blue-500 mb-4">
                    <i class="fa-solid fa-shield-halved text-3xl"></i>
                </div>
                <h1 class="text-2xl font-bold text-white tracking-wide">Guardiões do Bravo</h1>
                <p class="text-xs text-slate-400 mt-1 uppercase tracking-wider">Gestão Condominial Integrada</p>
            </div>

            <form id="loginForm" onsubmit="event.preventDefault(); fazerLogin();" class="space-y-5">
                <div>
                    <label class="block text-xs font-semibold uppercase text-slate-400 mb-2">Utilizador / E-mail</label>
                    <div class="relative">
                        <i class="fa-solid fa-user absolute left-4 top-1/2 -translate-y-1/2 text-slate-500"></i>
                        <input type="text" id="loginUser" required placeholder="admin" value="admin" class="input-dark-text w-full border border-slate-300 rounded-xl py-3 pl-11 pr-4 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 transition">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-semibold uppercase text-slate-400 mb-2">Palavra-passe</label>
                    <div class="relative">
                        <i class="fa-solid fa-lock absolute left-4 top-1/2 -translate-y-1/2 text-slate-500"></i>
                        <input type="password" id="loginPass" required placeholder="12345678" value="12345678" class="input-dark-text w-full border border-slate-300 rounded-xl py-3 pl-11 pr-4 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 transition">
                    </div>
                </div>

                <button type="submit" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-semibold py-3 rounded-xl transition shadow-lg shadow-blue-600/20 flex items-center justify-center gap-2">
                    <i class="fa-solid fa-right-to-bracket"></i>
                    <span>Entrar no Sistema</span>
                </button>
            </form>
        </div>
    </div>

    <!-- PAINEL PRINCIPAL (DASHBOARD) -->
    <div id="mainDashboard" class="hidden min-h-screen flex flex-col md:flex-row">
        <!-- Sidebar Navigation -->
        <aside class="w-full md:w-64 bg-slate-950 border-r border-slate-800 flex flex-col justify-between shrink-0">
            <div>
                <div class="p-6 border-b border-slate-800 flex items-center gap-3">
                    <div class="w-10 h-10 rounded-lg bg-blue-600 flex items-center justify-center text-white font-bold">
                        <i class="fa-solid fa-shield-halved text-xl"></i>
                    </div>
                    <div>
                        <h2 class="font-bold text-sm text-white leading-tight">Guardiões do Bravo</h2>
                        <span class="text-[10px] text-blue-400 font-medium uppercase tracking-wider">Condomínio</span>
                    </div>
                </div>

                <nav class="p-4 space-y-1">
                    <button onclick="navegarPara('dashboard')" id="nav-dashboard" class="nav-item active w-full flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-medium transition text-blue-400 bg-blue-600/10 border border-blue-500/20">
                        <i class="fa-solid fa-chart-pie w-5"></i> Dashboard
                    </button>
                    <button onclick="navegarPara('financeiro')" id="nav-financeiro" class="nav-item w-full flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-medium transition text-slate-400 hover:bg-slate-900 hover:text-white">
                        <i class="fa-solid fa-wallet w-5"></i> Financeiro
                    </button>
                    <button onclick="navegarPara('plano-contas')" id="nav-plano-contas" class="nav-item w-full flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-medium transition text-slate-400 hover:bg-slate-900 hover:text-white">
                        <i class="fa-solid fa-sitemap w-5"></i> Plano de Contas
                    </button>
                    <button onclick="navegarPara('bancos')" id="nav-bancos" class="nav-item w-full flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-medium transition text-slate-400 hover:bg-slate-900 hover:text-white">
                        <i class="fa-solid fa-building-columns w-5"></i> Bancos & Contas
                    </button>
                    <button onclick="navegarPara('moradores')" id="nav-moradores" class="nav-item w-full flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-medium transition text-slate-400 hover:bg-slate-900 hover:text-white">
                        <i class="fa-solid fa-users w-5"></i> Moradores & Unidades
                    </button>
                    <button onclick="navegarPara('fornecedores')" id="nav-fornecedores" class="nav-item w-full flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-medium transition text-slate-400 hover:bg-slate-900 hover:text-white">
                        <i class="fa-solid fa-truck-field w-5"></i> Fornecedores
                    </button>
                    <button onclick="navegarPara('estoque')" id="nav-estoque" class="nav-item w-full flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-medium transition text-slate-400 hover:bg-slate-900 hover:text-white">
                        <i class="fa-solid fa-boxes-stacked w-5"></i> Estoque & Inventário
                    </button>
                    <button onclick="navegarPara('documentos')" id="nav-documentos" class="nav-item w-full flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-medium transition text-slate-400 hover:bg-slate-900 hover:text-white">
                        <i class="fa-solid fa-folder-open w-5"></i> Documentos
                    </button>
                    <button onclick="navegarPara('usuarios')" id="nav-usuarios" class="nav-item w-full flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-medium transition text-slate-400 hover:bg-slate-900 hover:text-white">
                        <i class="fa-solid fa-user-gear w-5"></i> Utilizadores / Usuários
                    </button>
                </nav>
            </div>

            <div class="p-4 border-t border-slate-800">
                <button onclick="fazerLogout()" class="w-full flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-medium text-rose-400 hover:bg-rose-500/10 transition">
                    <i class="fa-solid fa-right-from-bracket w-5"></i> Terminar Sessão
                </button>
            </div>
        </aside>

        <!-- Main Content Area -->
        <main class="flex-1 bg-slate-900 p-6 md:p-8 overflow-y-auto">
            <header class="flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4 pb-6 border-b border-slate-800 mb-8">
                <div>
                    <h1 id="pageTitle" class="text-2xl font-bold text-white">Visão Geral</h1>
                    <p id="pageSubTitle" class="text-xs text-slate-400 mt-1">Gestão centralizada do Condomínio Guardiões do Bravo</p>
                </div>
                <div class="flex items-center gap-3">
                    <span class="px-3 py-1 rounded-full bg-emerald-500/10 border border-emerald-500/20 text-emerald-400 text-xs font-semibold flex items-center gap-2">
                        <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span> Sistema Ativo
                    </span>
                </div>
            </header>

            <!-- CONTEÚDO DINÂMICO DA PÁGINA -->
            <div id="contentArea"></div>
        </main>
    </div>

    <!-- MODAL CONTAINER (GENÉRICO PARA FORMULÁRIOS) -->
    <div id="modalContainer" class="hidden fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-4">
        <div id="modalBody" class="bg-slate-900 border border-slate-800 rounded-2xl shadow-2xl w-full max-w-2xl max-h-[90vh] overflow-y-auto p-6 relative custom-scrollbar">
            <!-- Conteúdo injetado via JS -->
        </div>
    </div>

    <!-- LIGHTBOX DE IMAGEM -->
    <div id="lightboxModal" class="hidden fixed inset-0 z-50 bg-black/90 flex items-center justify-center p-4 cursor-pointer" onclick="fecharLightbox()">
        <img id="lightboxImg" class="max-w-full max-h-[90vh] rounded-lg shadow-2xl border border-slate-700" src="" alt="Ampliação">
    </div>

    <script>
        // BANCO DE DADOS LOCAL COMPLETO COM SUPORTE À LOCALSTORAGE
        let dadosSistema = JSON.parse(localStorage.getItem('guardioes_bravo_db')) || {
            bancos: [
                { id: 'b1', nome: 'Itaú Unibanco', agencia: '0123', conta: '45678-9', saldo: 15400 },
                { id: 'b2', nome: 'Caixa Econômica', agencia: '4321', conta: '98765-4', saldo: 8200 }
            ],
            planoContas: [
                { id: 'pc1', codigo: '1.01', nome: 'Taxa Condominial', tipo: 'RECEITA' },
                { id: 'pc2', codigo: '1.02', nome: 'Taxa de Mudança (Inquilino)', tipo: 'RECEITA' },
                { id: 'pc3', codigo: '2.01', nome: 'Manutenção Preventiva', tipo: 'DESPESA' },
                { id: 'pc4', codigo: '2.02', nome: 'Energia Elétrica / Água', tipo: 'DESPESA' }
            ],
            moradores: [
                { id: 'm1', nome: 'Carlos Eduardo', bloco: 'A', ap: '101', tipo: 'Proprietario', contato: '(41) 99999-1111', possuiTaxaMudanca: 'nao', valorTaxa: 0, statusTaxa: 'Isento', dataPagamentoTaxa: '' },
                { id: 'm2', nome: 'Ana Paula Souza', bloco: 'B', ap: '304', tipo: 'Inquilino', contato: '(41) 98888-2222', possuiTaxaMudanca: 'sim', valorTaxa: 350.00, statusTaxa: 'Pendente', dataPagamentoTaxa: '' }
            ],
            fornecedores: [],
            financeiro: [],
            estoque: [],
            historicoEstoque: [],
            documentos: [],
            usuarios: [
                { id: 'u1', nome: 'Administrador Principal', usuario: 'admin', email: 'admin@guardioes.com', perfil: 'Administrador', status: 'Ativo' }
            ]
        };

        function salvarDadosLocal() {
            localStorage.setItem('guardioes_bravo_db', JSON.stringify(dadosSistema));
        }

        function fazerLogin() {
            const user = document.getElementById('loginUser').value;
            const pass = document.getElementById('loginPass').value;
            const uEncontrado = dadosSistema.usuarios.find(u => u.usuario === user && u.status === 'Ativo');

            if ((user === 'admin' && pass === '12345678') || uEncontrado) {
                document.getElementById('loginPage').classList.add('hidden');
                document.getElementById('mainDashboard').classList.remove('hidden');
                carregarDashboard();
            } else {
                alert('Credenciais incorretas ou utilizador inativo!');
            }
        }

        function fazerLogout() {
            document.getElementById('mainDashboard').classList.add('hidden');
            document.getElementById('loginPage').classList.remove('hidden');
        }

        function fecharModal() {
            document.getElementById('modalContainer').classList.add('hidden');
        }

        function abrirLightbox(url) {
            if(!url) return;
            document.getElementById('lightboxImg').src = url;
            document.getElementById('lightboxModal').classList.remove('hidden');
        }

        function fecharLightbox() {
            document.getElementById('lightboxModal').classList.add('hidden');
        }

        function navegarPara(pagina) {
            document.querySelectorAll('.nav-item').forEach(el => {
                el.classList.remove('active', 'text-blue-400', 'bg-blue-600/10', 'border', 'border-blue-500/20');
                el.classList.add('text-slate-400');
            });

            const currentNav = document.getElementById('nav-' + pagina);
            if(currentNav) {
                currentNav.classList.add('active', 'text-blue-400', 'bg-blue-600/10', 'border', 'border-blue-500/20');
            }

            const title = document.getElementById('pageTitle');
            const subTitle = document.getElementById('pageSubTitle');

            if(pagina === 'dashboard') {
                title.innerText = 'Visão Geral';
                subTitle.innerText = 'Resumo executivo do condomínio';
                carregarDashboard();
            } else if(pagina === 'moradores') {
                title.innerText = 'Moradores & Unidades';
                subTitle.innerText = 'Cadastro de proprietários e inquilinos por bloco/unidade com controle de Taxa de Mudança';
                carregarMoradores();
            } else if(pagina === 'fornecedores') {
                title.innerText = 'Fornecedores';
                subTitle.innerText = 'Busca Automática via CNPJ e Gestão de Prestadores';
                carregarFornecedores();
            } else if(pagina === 'estoque') {
                title.innerText = 'Estoque & Inventário';
                subTitle.innerText = 'Fotos do Produto, Inventário Físico e Acerto Auditado';
                carregarEstoque();
            } else if(pagina === 'usuarios') {
                title.innerText = 'Utilizadores / Usuários do Sistema';
                subTitle.innerText = 'Controle de Acessos e Níveis de Permissão';
                carregarUsuarios();
            } else if(pagina === 'documentos') {
                title.innerText = 'Gestão de Documentos';
                subTitle.innerText = 'Pastas, Grupos de Arquivos e Anexos Organizados';
                carregarDocumentos();
            } else if(pagina === 'financeiro') {
                title.innerText = 'Financeiro';
                subTitle.innerText = 'Gestão de Títulos e Contas a Pagar/Receber';
                carregarFinanceiro();
            } else if(pagina === 'bancos') {
                title.innerText = 'Bancos & Contas';
                subTitle.innerText = 'Controle de Saldos Bancários e Caixas';
                carregarBancos();
            } else if(pagina === 'plano-contas') {
                title.innerText = 'Plano de Contas';
                subTitle.innerText = 'Categorização de Receitas e Despesas';
                carregarPlanoContas();
            }
        }

        // ==========================================
        // 1. DASHBOARD COM ALERTAS DA TAXA DE MUDANÇA
        // ==========================================
        function carregarDashboard() {
            const taxasPendentes = dadosSistema.moradores.filter(m => m.tipo === 'Inquilino' && m.statusTaxa === 'Pendente');
            const totalPendentesTaxa = taxasPendentes.reduce((acc, m) => acc + Number(m.valorTaxa || 0), 0);

            const content = document.getElementById('contentArea');
            content.innerHTML = `
                <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6 mb-8">
                    <div class="bg-slate-950 p-6 rounded-2xl border border-slate-800">
                        <span class="text-xs font-semibold text-slate-400 uppercase">Moradores Cadastrados</span>
                        <h3 class="text-2xl font-bold text-blue-400 mt-2">${dadosSistema.moradores.length} Unidades</h3>
                        <p class="text-xs text-slate-500 mt-1">Total de ativos</p>
                    </div>
                    <div class="bg-slate-950 p-6 rounded-2xl border border-amber-500/30">
                        <span class="text-xs font-semibold text-amber-400 uppercase">Taxas de Mudança Pendentes</span>
                        <h3 class="text-2xl font-bold text-amber-400 mt-2">R$ ${totalPendentesTaxa.toLocaleString('pt-BR', {minimumFractionDigits: 2})}</h3>
                        <p class="text-xs text-slate-400 mt-1">${taxasPendentes.length} Inquilino(s) pendente(s)</p>
                    </div>
                    <div class="bg-slate-950 p-6 rounded-2xl border border-slate-800">
                        <span class="text-xs font-semibold text-slate-400 uppercase">Produtos no Estoque</span>
                        <h3 class="text-2xl font-bold text-emerald-400 mt-2">${dadosSistema.estoque.length} Itens</h3>
                        <p class="text-xs text-slate-500 mt-1">Com foto e quantidade</p>
                    </div>
                    <div class="bg-slate-950 p-6 rounded-2xl border border-slate-800">
                        <span class="text-xs font-semibold text-slate-400 uppercase">Utilizadores do Sistema</span>
                        <h3 class="text-2xl font-bold text-purple-400 mt-2">${dadosSistema.usuarios.length} Credenciais</h3>
                        <p class="text-xs text-slate-500 mt-1">Acesso ao painel</p>
                    </div>
                </div>

                ${taxasPendentes.length > 0 ? `
                    <div class="bg-amber-950/20 border border-amber-500/30 rounded-2xl p-6 mb-8">
                        <h3 class="text-base font-bold text-amber-400 flex items-center gap-2 mb-4">
                            <i class="fa-solid fa-triangle-exclamation"></i> Taxas de Mudança de Inquilinos com Pagamento Pendente
                        </h3>
                        <div class="divide-y divide-slate-800">
                            ${taxasPendentes.map(m => `
                                <div class="py-3 flex flex-col sm:flex-row items-start sm:items-center justify-between gap-3">
                                    <div>
                                        <div class="font-bold text-white text-sm">${m.nome} <span class="text-xs font-normal text-slate-400">(Bloco ${m.bloco} - AP ${m.ap})</span></div>
                                        <div class="text-xs text-slate-400">Contato: ${m.contato || 'Não informado'}</div>
                                    </div>
                                    <div class="flex items-center gap-3">
                                        <span class="font-bold text-amber-400 text-sm">R$ ${Number(m.valorTaxa).toFixed(2)}</span>
                                        <button onclick="baixarTaxaMudancaDireto('${m.id}')" class="bg-emerald-600 hover:bg-emerald-500 text-white text-xs px-3 py-1.5 rounded-lg font-semibold transition">
                                            <i class="fa-solid fa-check mr-1"></i> Baixar Pago
                                        </button>
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                ` : ''}
            `;
        }

        // ==========================================
        // 2. MODULO DE MORADORES & TAXA DE MUDANÇA
        // ==========================================
        function carregarMoradores() {
            const content = document.getElementById('contentArea');
            content.innerHTML = `
                <div class="flex justify-between items-center mb-6">
                    <h3 class="text-lg font-bold text-white">Cadastro de Moradores</h3>
                    <button onclick="modalNovoMorador()" class="bg-blue-600 hover:bg-blue-500 text-white px-4 py-2.5 rounded-xl text-sm font-semibold transition flex items-center gap-2 shadow-lg shadow-blue-600/20">
                        <i class="fa-solid fa-user-plus"></i> Novo Morador
                    </button>
                </div>
                <div class="bg-slate-950 border border-slate-800 rounded-2xl overflow-hidden">
                    <table class="w-full text-left border-collapse text-sm">
                        <thead class="bg-slate-900 text-slate-400 text-xs uppercase border-b border-slate-800">
                            <tr>
                                <th class="p-4">Nome</th>
                                <th class="p-4">Bloco/AP</th>
                                <th class="p-4">Tipo</th>
                                <th class="p-4">Contato</th>
                                <th class="p-4">Taxa de Mudança</th>
                                <th class="p-4 text-right">Ações</th>
                            </tr>
                        </thead>
                        <tbody class="divide-y divide-slate-800 text-slate-300">
                            ${gerarLinhasMoradores(dadosSistema.moradores)}
                        </tbody>
                    </table>
                </div>
            `;
        }

        function gerarLinhasMoradores(lista) {
            if(lista.length === 0) return `<tr><td colspan="6" class="p-8 text-center text-slate-500">Nenhum morador registrado.</td></tr>`;
            return lista.map((m, idx) => {
                let badgeTaxa = '<span class="text-xs text-slate-500">N/A</span>';
                if (m.tipo === 'Inquilino') {
                    if (m.statusTaxa === 'Pago') {
                        badgeTaxa = `<span class="px-2.5 py-1 rounded-full text-xs font-semibold bg-emerald-500/10 text-emerald-400 border border-emerald-500/20"><i class="fa-solid fa-check-circle mr-1"></i>Paga (R$ ${Number(m.valorTaxa).toFixed(2)})</span>`;
                    } else if (m.statusTaxa === 'Pendente') {
                        badgeTaxa = `<span class="px-2.5 py-1 rounded-full text-xs font-semibold bg-rose-500/10 text-rose-400 border border-rose-500/20"><i class="fa-solid fa-clock mr-1"></i>Pendente (R$ ${Number(m.valorTaxa).toFixed(2)})</span>`;
                    } else {
                        badgeTaxa = `<span class="px-2.5 py-1 rounded-full text-xs font-semibold bg-slate-800 text-slate-400">Isento</span>`;
                    }
                }
                return `
                    <tr class="hover:bg-slate-900/50 transition">
                        <td class="p-4 font-semibold text-white">${m.nome}</td>
                        <td class="p-4 text-xs">Bloco ${m.bloco} - AP ${m.ap}</td>
                        <td class="p-4"><span class="px-2.5 py-1 rounded-full text-xs font-semibold ${m.tipo === 'Inquilino' ? 'bg-amber-500/10 text-amber-400 border border-amber-500/20' : 'bg-blue-500/10 text-blue-400 border border-blue-500/20'}">${m.tipo}</span></td>
                        <td class="p-4 text-xs">${m.contato || '-'}</td>
                        <td class="p-4">${badgeTaxa}</td>
                        <td class="p-4 text-right flex justify-end gap-2">
                            <button onclick="modalEditarMorador(${idx})" class="text-blue-400 hover:text-blue-300 p-2"><i class="fa-solid fa-pen-to-square"></i></button>
                            <button onclick="excluirMorador(${idx})" class="text-rose-400 hover:text-rose-300 p-2"><i class="fa-solid fa-trash"></i></button>
                        </td>
                    </tr>
                `;
            }).join('');
        }

        function alternarTipoMoradorForm(selectEl) {
            const container = document.getElementById('containerTaxaMudanca');
            if (selectEl.value === 'Inquilino') {
                container.classList.remove('hidden');
            } else {
                container.classList.add('hidden');
            }
        }

        function modalNovoMorador() {
            document.getElementById('modalBody').innerHTML = `
                <div class="flex justify-between items-center mb-6">
                    <h3 class="text-lg font-bold text-white">Novo Cadastramento de Morador</h3>
                    <button onclick="fecharModal()" class="text-slate-400 hover:text-white"><i class="fa-solid fa-xmark text-xl"></i></button>
                </div>
                <form onsubmit="event.preventDefault(); salvarMorador();" class="space-y-4">
                    <div>
                        <label class="block text-xs font-semibold uppercase text-slate-400 mb-1">Nome Completo</label>
                        <input type="text" id="mNome" required class="input-dark-text w-full border border-slate-300 rounded-xl p-3 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                    </div>
                    <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
                        <div>
                            <label class="block text-xs font-semibold uppercase text-slate-400 mb-1">Bloco / Torre</label>
                            <input type="text" id="mBloco" required class="input-dark-text w-full border border-slate-300 rounded-xl p-3 text-sm focus:outline-none">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold uppercase text-slate-400 mb-1">Apartamento</label>

        async function buscarCNPJBrasilAPI() {
            const rawCnpj = document.getElementById('fCnpj').value.replace(/\D/g, '');
            if (rawCnpj.length !== 14) {
                alert("Por favor, digite um CNPJ válido com 14 dígitos.");
                return;
            }
            try {
                const response = await fetch(`https://brasilapi.com.br/api/cnpj/v1/${rawCnpj}`);
                if (!response.ok) throw new Error("CNPJ não encontrado.");
                const data = await response.json();
                
                document.getElementById('fNome').value = data.nome_fantasia || data.razao_social || '';
                document.getElementById('fCategoria').value = data.cnae_fiscal_descricao || '';
                document.getElementById('fTelefone').value = data.ddd_telefone_1 || '';
                alert("Dados do CNPJ preenchidos automaticamente com sucesso!");
            } catch (err) {
                alert("Erro ao consultar o CNPJ na BrasilAPI. Verifique o número digitado.");
            }
        }

                                    <td class="p-4 font-mono text-xs text-purple-400">${u.usuario}</td>
                                    <td class="p-4 text-xs">${u.perfil}</td>
                                    <td class="p-4"><span class="px-2 py-1 rounded text-xs ${u.status === 'Ativo' ? 'bg-emerald-500/10 text-emerald-400' : 'bg-rose-500/10 text-rose-400'}">${u.status}</span></td>
                                </tr>
                            `).join('')}
                        </tbody>
                    </table>
                </div>
            `;
        }

        function modalNovoUsuario() {
            document.getElementById('modalBody').innerHTML = `
                <div class="flex justify-between items-center mb-6">
                    <h3 class="text-lg font-bold text-white">Cadastrar Usuário</h3>
                    <button onclick="fecharModal()" class="text-slate-400 hover:text-white"><i class="fa-solid fa-xmark text-xl"></i></button>
                </div>
                <form onsubmit="event.preventDefault(); salvarUsuario();" class="space-y-4">
                    <div>
                        <label class="block text-xs font-semibold uppercase text-slate-400 mb-1">Nome Completo</label>
                        <input type="text" id="uNome" required class="input-dark-text w-full border border-slate-300 rounded-xl p-3 text-sm focus:outline-none">
                    </div>
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-xs font-semibold uppercase text-slate-400 mb-1">Nome de Usuário (Login)</label>
                            <input type="text" id="uUsuario" required class="input-dark-text w-full border border-slate-300 rounded-xl p-3 text-sm focus:outline-none">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold uppercase text-slate-400 mb-1">Perfil de Acesso</label>
                            <select id="uPerfil" class="input-dark-text w-full border border-slate-300 rounded-xl p-3 text-sm focus:outline-none">
                                <option value="Administrador">Administrador</option>
                                <option value="Síndico">Síndico</option>
                                <option value="Portaria/Operacional">Portaria / Operacional</option>
                                <option value="Conselho Fiscal">Conselho Fiscal</option>
                            </select>
                        </div>
                    </div>
                    <div class="flex justify-end gap-3 pt-4">
                        <button type="button" onclick="fecharModal()" class="px-5 py-2.5 rounded-xl border border-slate-800 text-slate-400 hover:text-white text-sm font-semibold">Cancelar</button>
                        <button type="submit" class="px-5 py-2.5 rounded-xl bg-purple-600 hover:bg-purple-500 text-white text-sm font-semibold">Salvar Usuário</button>
                    </div>
                </form>
            `;
            document.getElementById('modalContainer').classList.remove('hidden');
        }

        function salvarUsuario() {
            dadosSistema.usuarios.push({
                id: 'u' + (dadosSistema.usuarios.length + 1),
                nome: document.getElementById('uNome').value,
                usuario: document.getElementById('uUsuario').value,
                perfil: document.getElementById('uPerfil').value,
                status: 'Ativo'
            });
            salvarDadosLocal();
            fecharModal();
            carregarUsuarios();
        }

        function carregarDocumentos() {
            document.getElementById('contentArea').innerHTML = `
                <div class="p-8 text-center bg-slate-950 border border-slate-800 rounded-2xl">
                    <i class="fa-solid fa-folder-open text-4xl text-blue-500 mb-4"></i>
                    <h3 class="text-lg font-bold text-white">Módulo de Documentos Ativo</h3>
                    <p class="text-sm text-slate-400 mt-2">Separação por grupos (Atas, Contratos, Comprovantes) com salvamento em LocalStorage.</p>
                </div>
            `;
        }

        function carregarFinanceiro() { carregarDashboard(); }
        function carregarBancos() { carregarDashboard(); }
        function carregarPlanoContas() { carregarDashboard(); }
    </script>
</body>
</html>
